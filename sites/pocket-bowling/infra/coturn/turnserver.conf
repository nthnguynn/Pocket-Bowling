# Copy this file for deployment and replace the example values.
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=REPLACE_WITH_THE_SAME_TURN_SECRET_AS_SIGNALING
realm=pocket-bowling.local
total-quota=100
stale-nonce=600
no-multicast-peers
no-cli
# Set the public/private mapping when Coturn is behind NAT:
# external-ip=203.0.113.10/192.168.1.20
# min-port=49160
# max-port=49200
# TLS requires a real certificate:
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
